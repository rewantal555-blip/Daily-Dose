<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the Daily Dose café menu featuring specialty coffee, fresh pastries, delicious desserts, and more."
    />
    <meta
      name="keywords"
      content="Daily Dose menu, café menu, specialty coffee, pastries, desserts"
    />
    <!-- Css Bootstrap library-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Main css file -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Daily Dose</title>
  </head>
  <body>
  <!-- navigation / navbar adapted from Bootstrap -->
    <!-- Add fixed position to the navbar when scrolling -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          >Daily Dose <i class="fa-solid fa-mug-hot"></i
        ></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mb-2 mb-lg-0 ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <!-- Navigate to the About section on the home page -->
              <a class="nav-link" href="index.html#about">About</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="menu.html"
                >Menu</a
              >
            </li>
            <li class="nav-item">
              
              <a class="nav-link" href="#gallery">Gallery</a>
            </li>
            <li class="nav-item">
              <!-- Navigate to the Contact section on the home page -->
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link btn custom-button ms-lg-3" href="inquiry.html"
                >Get In Touch</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>



    <!-- Font Awsome kit -->
    <script src="https://kit.fontawesome.com/5d4007c5b0.js"></script>
    <!-- javascript Bootstrap library -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- JavaScript code to ensure the Bootstrap mobile navbar collapses when navigating to in-page links -->
    <script>
      document
        .querySelectorAll(".navbar-collapse .nav-link")
        .forEach((link) => {
          link.addEventListener("click", function (e) {
            let section = document.querySelector(e.target.getAttribute("href"));
            if (section) {
              e.preventDefault(); // Prevent default anchor click behavior
              let navbarHeight =
                document.querySelector(".navbar-toggler").offsetHeight;
              window.scroll({
                top: section.offsetTop - navbarHeight, // Adjust for navbar height
                behavior: "smooth",
              });
              document
                .querySelector(".navbar-collapse")
                .classList.remove("show"); // Collapse navbar
            }
          });
        });
    </script>
  </body>
</html>
